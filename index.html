<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfOS - Legal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            text-align: center;
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        .tagline {
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            display: block;
            padding: 20px 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .privacy {
            border-color: #10b981;
        }
        .privacy:hover {
            background: rgba(16, 185, 129, 0.2);
        }
        .terms {
            border-color: #f59e0b;
        }
        .terms:hover {
            background: rgba(245, 158, 11, 0.2);
        }
        .contact {
            margin-top: 40px;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }
        .contact a {
            display: inline;
            padding: 0;
            background: none;
            border: none;
            color: #10b981;
            font-size: 0.9rem;
        }
        .contact a:hover {
            background: none;
            transform: none;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>SelfOS</h1>
        <p class="tagline">Your Life's Operating System</p>

        <div class="links">
            <a href="privacy-policy.html" class="privacy">
                🛡️ Privacy Policy
            </a>
            <a href="terms-of-use.html" class="terms">
                📄 Terms of Use
            </a>
        </div>

        <p class="contact">
            Contact: <a href="mailto:selfos.contact@gmail.com">selfos.contact@gmail.com</a>
        </p>
        <p class="contact" style="margin-top: 12px;">
            <a href="https://platform.fatsecret.com">Powered by fatsecret Platform API</a>
        </p>
    </div>
</body>
</html>
