<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>SelfOS: Self-Care Tracker</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1f17;
    color: #e8f0eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card { padding: 32px 24px; max-width: 320px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 15px; opacity: 0.75; margin: 0 0 28px; }
  .btn {
    display: block;
    margin: 12px 0;
    padding: 14px 20px;
    border-radius: 12px;
    background: #1e4634;
    color: #e8f0eb;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
  }
  .btn.secondary { background: transparent; border: 1px solid #2c5a44; }
</style>
</head>
<body>
<div class="card">
  <h1>SelfOS: Self-Care Tracker</h1>
  <p>Taking you to the store...</p>
  <a class="btn" id="ios-link" href="https://apps.apple.com/app/id6756428834?ct=alesya_story&amp;mt=8">Download on the App Store</a>
  <a class="btn secondary" id="android-link" href="https://play.google.com/store/apps/details?id=com.selfos.app&amp;referrer=utm_source%3Dalesya%26utm_medium%3Dinfluencer%26utm_campaign%3Dig_story">Get it on Google Play</a>
</div>
<script>
  (function () {
    var ua = navigator.userAgent || "";
    var isAndroid = /android/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua) ||
      (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1); /* iPadOS reports as Mac */
    if (isAndroid) {
      location.replace(document.getElementById("android-link").href);
    } else if (isIOS) {
      location.replace(document.getElementById("ios-link").href);
    }
    /* Desktop and unknown devices stay on this page and pick a store manually */
  })();
</script>
</body>
</html>
